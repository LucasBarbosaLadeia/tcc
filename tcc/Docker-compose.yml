services:
  # =========================
  # Frontend React / Vite
  # =========================
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"
    networks:
      - app-net

  # =========================
  # Banco de Dados MySQL
  # =========================
  database:
    image: mysql:8.0
    container_name: mysql-container
    environment:
      - MYSQL_ROOT_PASSWORD=1234
      - MYSQL_DATABASE=saude_na_mao
      - MYSQL_USER=app
      - MYSQL_PASSWORD=1234
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-net

  # =========================
  # Backend Node.js
  # =========================
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: backend
    environment:
      - DB_HOST=database
      - DB_PORT=3306
      - DB_USER=app
      - DB_PASSWORD=1234
      - DB_NAME=saude_na_mao
      - JWT_SECRET=uma_chave_super_forte
      - JWT_EXPIRES_IN=1d
      - NODE_ENV=production
    depends_on:
      - database
    ports:
      - "8080:3001"
    networks:
      - app-net

  # =========================
  # Nginx
  # =========================
  nginx:
    build:
      context: ./Nginx
      dockerfile: Dockerfile
    container_name: nginx-container
    ports:
      - "8081:80"
    depends_on:
      - backend
    networks:
      - app-net

# =========================
# Volumes e redes
# =========================
volumes:
  db_data:

networks:
  app-net:
    driver: bridge
