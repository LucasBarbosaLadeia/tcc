services:
  # =========================
  # Banco de Dados MySQL
  # =========================
  database:
    image: mysql:8.0
    container_name: mysql-container
    environment:
      - MYSQL_ROOT_PASSWORD=1234
      - MYSQL_DATABASE=saude_na_mao
      - MYSQL_USER=app
      - MYSQL_PASSWORD=1234
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-net

  # =========================
  # Backend Node.js
  # =========================
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: backend
    environment:
      - DB_HOST=database
      - DB_PORT=3306
      - DB_USER=app
      - DB_PASSWORD=1234
      - DB_NAME=saude_na_mao
      - JWT_SECRET=uma_chave_super_forte
      - JWT_EXPIRES_IN=1d
      - NODE_ENV=production
    depends_on:
      - database
    ports:
      - "8080:3001"
    networks:
      - app-net

  # =========================
  # Nginx
  # =========================
  nginx:
    build:
      context: ./Nginx
      dockerfile: Dockerfile
    container_name: nginx-container
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-net
  loki:
    image: grafana/loki
    restart: on-failure
    user: "0"
    command: ["-config.file=/etc/loki/loki.yml"]
    container_name: loki
    ports:
      - "3100:3000"
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - /var/loki
    networks:
      - app-net
  grafana:
    image: grafana/grafana
    restart: on-failure
    depends_on:
      - loki
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    container_name: grafana
    volumes:
      - /var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    networks:
      - app-net

# =========================
# Volumes e redes
# =========================
volumes:
  db_data:

networks:
  app-net:
    driver: bridge
